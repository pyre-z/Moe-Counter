<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moe Counter! · 白名单管理</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f5f5f7; color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1d1d1f; color: #f5f5f7; }
    .card { background: #2c2c2e; box-shadow: 0 4px 24px rgba(0,0,0,.4); }
    input { background: #3a3a3c; color: #f5f5f7; border-color: #48484a; }
    .tag { background: #3a3a3c; }
    .del { color: #ff6b6b; }
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px; width: 420px; max-width: 94vw;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .6; font-size: 12px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; opacity: .8; }
  input {
    width: 100%; padding: 8px 12px; border: 1px solid #d2d2d7; border-radius: 8px;
    font-size: 14px; outline: none;
  }
  input:focus { border-color: #0071e3; }
  .row { display: flex; gap: 8px; margin-top: 6px; }
  .row input { flex: 1; }
  button {
    border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px;
    background: #0071e3; color: #fff; cursor: pointer; white-space: nowrap;
  }
  button:hover { opacity: .9; }
  button.secondary { background: #86868b; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg.ok { color: #34c759; }
  .msg.err { color: #ff3b30; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; background: #f0f0f2;
    border-radius: 20px; padding: 4px 10px 4px 14px; font-size: 13px;
  }
  .tag .del { cursor: pointer; font-weight: bold; opacity: .5; }
  .tag .del:hover { opacity: 1; color: #ff3b30; }
  .empty { font-size: 13px; opacity: .5; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Moe Counter! · 白名单管理</h1>
  <div class="sub">开启后仅允许以下计数名被访问（demo 恒放行）</div>

  <label>Admin Token</label>
  <input type="password" id="token" placeholder="输入 ADMIN_TOKEN" autocomplete="current-password">

  <label>添加计数名</label>
  <div class="row">
    <input type="text" id="newName" placeholder="如 blog / azure" maxlength="32">
    <button id="addBtn">添加</button>
  </div>

  <div class="msg" id="msg"></div>

  <div id="listWrap">
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none">暂无白名单计数名</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const msgEl = $("msg");
let token = "";

function showMsg(text, ok) {
  msgEl.textContent = text || "";
  msgEl.className = "msg " + (ok ? "ok" : (text ? "err" : ""));
}

function getToken() {
  const t = $("token").value.trim();
  if (!t) { showMsg("请先输入 Admin Token", false); return null; }
  token = t;
  return t;
}

async function api(path, method) {
  const t = getToken();
  if (!t) return null;
  try {
    const r = await fetch(path, {
      method: method || "GET",
      headers: { "Authorization": "Bearer " + t },
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { showMsg(data.error || ("HTTP " + r.status), false); return null; }
    showMsg("", true);
    return data;
  } catch (e) {
    showMsg("请求失败: " + e, false);
    return null;
  }
}

function render(names) {
  const ul = $("list");
  const empty = $("empty");
  ul.innerHTML = "";
  if (!names || names.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  names.forEach((n) => {
    const li = document.createElement("li");
    li.className = "tag";
    li.innerHTML = '<span class="nm"></span><span class="del" title="删除">✕</span>';
    li.querySelector(".nm").textContent = n;
    li.querySelector(".del").addEventListener("click", async () => {
      const d = await api("/admin/allow/" + encodeURIComponent(n), "DELETE");
      if (d) render(d.names);
    });
    ul.appendChild(li);
  });
}

$("addBtn").addEventListener("click", async () => {
  const name = $("newName").value.trim();
  if (!name) { showMsg("请输入计数名", false); return; }
  const d = await api("/admin/allow/" + encodeURIComponent(name), "POST");
  if (d) { render(d.names); $("newName").value = ""; }
});

$("token").addEventListener("change", async () => {
  const d = await api("/admin/allow", "GET");
  if (d) render(d.names);
});

$("newName").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("addBtn").click();
});
</script>
</body>
</html>
